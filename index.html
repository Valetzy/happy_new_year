<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy New Year ✨</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap');

body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffd6e8, #e0c3fc);
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
}

.heart {
    position: absolute;
    color: #ff6fae;
    font-size: 18px;
    animation: float 6s infinite ease-in;
    opacity: 0.6;
}

@keyframes float {
    0% { transform: translateY(100vh) scale(1); }
    100% { transform: translateY(-10vh) scale(1.5); }
}

.card {
    width: min(90vw, 380px);
    background: #fff;
    border-radius: 30px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    animation: pop 1s ease;
}

@keyframes pop {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}

.card img {
    width: 65%;
    margin-bottom: 15px;
}

.card h1 {
    font-size: 1.6rem;
    color: #ff4f9a;
    margin-bottom: 20px;
}

.sparkle {
    animation: sparkle 1.5s infinite alternate;
}

@keyframes sparkle {
    from { text-shadow: 0 0 5px #ff9acb; }
    to   { text-shadow: 0 0 15px #ffd1e8; }
}

/* Link styled as button */
.card a {
    display: inline-block;
    text-decoration: none;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    color: white;
    padding: 12px 25px;
    border-radius: 25px;
    box-shadow: 0 10px 20px rgba(255,105,180,0.4);
    transition: transform 0.2s, box-shadow 0.2s;
}

.card a:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 25px rgba(255,105,180,0.6);
}
</style>
</head>

<body>

<span class="heart" style="left:10%;">💖</span>
<span class="heart" style="left:30%; animation-delay:1s;">💗</span>
<span class="heart" style="left:50%; animation-delay:2s;">💖</span>
<span class="heart" style="left:70%; animation-delay:3s;">💗</span>
<span class="heart" style="left:90%; animation-delay:4s;">💖</span>

<div class="card">
    <img src="tenor.gif" alt="Cute Gif">
    <h1 class="sparkle">Happy New Year Babe ❤️</h1>
    <a href="greetings.html">Smile before you click 😊</a>
</div>

</body>
</html>
